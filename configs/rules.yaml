# Seuils réglés sur le dataset Mendeley (vues de profil ; + diagonale pour la pompe), 9 nov. 2026.
# Médianes par clip : squat genou 66-72° en bas / ~175° en haut ; pompe coude 72-79° / ~168° ;
# curl coude 57-65° / ~168°. Voir scripts/eval_rep_counter.py.
rep_counter:
  squat:  {angle: knee,  top_above: 160, bottom_below: 100}
  pushup: {angle: elbow, top_above: 150, bottom_below: 100}
  curl:   {angle: elbow, top_above: 145, bottom_below: 80}

form_rules:
  squat:
    - {code: SQUAT_SHALLOW, check: "min_knee > 100",  tip: "Go a bit lower", priority: 2}
    - {code: SQUAT_LEAN,    check: "torso_lean > 45", tip: "Chest up!",      priority: 1}
  pushup:
    - {code: PUSHUP_SAG,     check: "body_line < 160", tip: "Tighten your core", priority: 1}
    - {code: PUSHUP_SHALLOW, check: "min_elbow > 90",  tip: "Lower your chest",  priority: 2}
  curl:
    - {code: CURL_SWING,   check: "arm_swing > 20", tip: "Keep elbows still",  priority: 1}
    - {code: CURL_PARTIAL, check: "min_elbow > 50", tip: "Squeeze to the top", priority: 2}
