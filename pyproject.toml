[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workout-coach"
version = "0.1.0"
description = "Coach sportif par webcam : reconnaissance d'exercice, comptage de répétitions, correction de posture."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "opencv-python-headless>=4.9",
    "mediapipe>=0.10",
    "numpy>=1.26",
    "torch>=2.2",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "SQLAlchemy>=2.0",
    "PyYAML>=6.0",
    "streamlit>=1.46",
    "imageio-ffmpeg>=0.5",
    "mlflow>=2.12",
    "python-dotenv>=1.0",
    "pywin32>=306; sys_platform == 'win32'",   # voix (SAPI) sous Windows
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
coach = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
src = ["backend", "frontend"]   # code du projet (imports « first-party »)
line-length = 100
